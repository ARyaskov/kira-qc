[package]
name = "kira-qc"
description = "FastQC-compatible QC tool written in Rust"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/ARyaskov/kira-qc"
keywords = [
    "bioinformatics",
    "genomics",
    "quality-control",
    "dna",
    "fastq"
]
categories = [
    "science",
    "science::bioinformatics",
    "science::bioinformatics::sequence-analysis",
    "command-line-utilities",
    "algorithms"
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
kira-fastq = "0.2"
zip = "7.2.0"
aho-corasick = "1"
svg2pdf = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rustc-hash = "2"

[profile.release]
codegen-units = 1
lto = "fat"

[lints.clippy]
# The SVG plotter helpers in `report::html` legitimately take many positional
# parameters (out, data, width, height, multiple axis bounds, labels, …).
# Refactoring them into builder structs would obscure call sites without any
# functional benefit, so we suppress this lint at crate scope.
too_many_arguments = "allow"

[features]
default = []
no-kmer = []
